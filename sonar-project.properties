# SonarCloud scan configuration. Analysis itself runs from the `sonarcloud`
# job in .github/workflows/ci.yml; this file only narrows what counts toward
# the quality gate.
sonar.projectKey=Astrea-Payouts_astrea
sonar.organization=astrea-payouts

# Manual, network-touching harnesses and one-off scripts have no unit tests
# by design (they drive real testnet contracts), so they are excluded from
# coverage. They stay in scope for every other rule.
sonar.coverage.exclusions=services/core-go/cmd/**,apps/web/scripts/**,smart-contracts/**/scripts/**
