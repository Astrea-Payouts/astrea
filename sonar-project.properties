sonar.projectKey=Astrea-Payouts_astrea
sonar.organization=astrea-payouts

# Sources
sonar.sources=apps/web/src,services/core-go,smart-contracts/astrea/contracts/event-escrow/src
sonar.exclusions=**/node_modules/**,**/*.test.ts,**/*.test.tsx,**/*_test.go,**/dist/**,**/.next/**,**/generated/**,graphify-out/**,**/target/**

# Tests (kept separate from sources so Sonar doesn't count them as production code)
sonar.tests=apps/web/src,services/core-go,smart-contracts/astrea/contracts/event-escrow
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*_test.go,**/tests/**

# TypeScript coverage
sonar.javascript.lcov.reportPaths=apps/web/coverage/lcov.info
sonar.typescript.lcov.reportPaths=apps/web/coverage/lcov.info

# Go coverage
sonar.go.coverage.reportPaths=services/core-go/coverage.out

# Rust coverage (Cobertura format, generated by cargo-tarpaulin in CI)
sonar.rust.cobertura.reportPaths=smart-contracts/astrea/cobertura.xml

# Manual, network-touching harnesses and one-off scripts have no unit tests
# by design (they drive real testnet contracts), so they are excluded from
# coverage only. They stay in scope for every other rule.
sonar.coverage.exclusions=services/core-go/cmd/**,apps/web/scripts/**,smart-contracts/**/scripts/**
