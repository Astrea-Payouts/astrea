name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

jobs:
  build-lint-test:
    name: Lint, typecheck, test, build (web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - working-directory: apps/web
        run: npm ci --legacy-peer-deps

      - name: Lint (Biome)
        working-directory: apps/web
        run: npm run lint

      - name: Typecheck
        working-directory: apps/web
        run: npm run typecheck

      - name: Test (Vitest)
        working-directory: apps/web
        run: npm run test

      - name: Build
        working-directory: apps/web
        run: npm run build

  graphify-rebuild:
    name: Rebuild knowledge graph (develop only)
    # CI is the ONLY writer of graphify-out/ now. Contributors do not rebuild
    # the graph, do not commit it, and do not install graphify at all - the
    # husky hooks that used to enforce that were removed alongside this job's
    # predecessor, `graphify-drift-check`.
    #
    # Why that job is gone: it demanded a byte-identical rebuild from every
    # contributor's machine. That is a determinism guarantee a floating-point,
    # parallel graph build does not offer across operating systems - it failed
    # on #151 over edge ordering and betweenness rounding with no actual drift -
    # and generated output was the ONLY conflicting file in #139, #153 and #158.
    # One writer on one OS removes the entire class of problem.
    #
    # Runs ONLY on a push to develop (i.e. after a merge), never on a PR: a PR
    # branch's graph is stale by design and nothing checks it any more.
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    permissions:
      # The repository default for GITHUB_TOKEN is read-only; this job has to
      # push the rebuilt graph back to develop.
      contents: write
      # ...and publish graph.html to GitHub Pages. id-token is what
      # actions/deploy-pages uses to prove the deployment came from this run.
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy-graph.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          # Needed to push back - the default shallow checkout cannot.
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      # postinstall runs `prisma generate`, producing apps/web/src/generated/prisma.
      # graphify indexes that output, so it must exist before the rebuild below.
      - working-directory: apps/web
        run: npm ci --legacy-peer-deps

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # Pinned deliberately - a version bump can change manifest-parsing
      # behaviour and silently reshape the graph. Bump on purpose, not by drift.
      - name: Install graphify
        run: pip install graphifyy==0.9.45

      # Code-only rebuild - no LLM, no API key. Doc-driven changes still need a
      # `/graphify --update` from an agent session; see CONTRIBUTING.md.
      #
      # Both env vars pin determinism: PYTHONHASHSEED alone still produced a
      # different graph per run, because parallel AST workers finish in a random
      # order and feed Louvain clustering non-deterministically. The old job set
      # only PYTHONHASHSEED despite its own comment saying both were needed,
      # which is the likeliest source of the phantom drift that failed #151.
      - name: Rebuild code graph
        env:
          PYTHONHASHSEED: "0"
          GRAPHIFY_MAX_WORKERS: "1"
        run: graphify update .

      # Publish the interactive graph so it can be read without cloning the
      # repo. graph.html is a self-contained 1 MB page - no external assets, no
      # build step - so "publishing" is a copy. Runs whether or not the commit
      # the commit step below succeeds: a blocked push must not leave the site stale.
      - name: Assemble the Pages site
        run: |
          mkdir -p _site
          cp graphify-out/graph.html _site/index.html
          cp graphify-out/GRAPH_REPORT.md _site/GRAPH_REPORT.md

      # enablement: true turns Pages on the first time this runs, so the repo
      # does not need it switched on by hand beforehand.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deploy-graph
        uses: actions/deploy-pages@v4

      # Attempted LAST, deliberately. Pushing to develop is the only step here
      # that can fail for reasons outside this workflow, and publishing must
      # not depend on it - in the first run of this job it did, and a rejected
      # push took the Pages deploy down with it.
      #
      # Why it gets rejected: branch protection requires every required status
      # check to be green ON the commit being pushed. A bot commit carrying
      # [skip ci] can never satisfy that. Dropping [skip ci] does not help
      # either - at push time the checks have not run yet. Direct pushes to
      # develop are simply not possible while required checks exist.
      #
      # So this is best-effort. If the push is refused the job stays green, the
      # rebuilt graph is uploaded as an artifact, and the published site above
      # is already current - only the copy committed in git lags, and a
      # maintainer refreshes that. To make it commit automatically,
      # github-actions[bot] needs a bypass on develop's required status checks
      # (a repository ruleset with a bypass actor); this step then starts
      # working with no change here.
      - name: Commit the rebuilt graph back to develop (best-effort)
        run: |
          if git diff --quiet -- graphify-out/; then
            echo "Graph already matches develop - nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add graphify-out/
          git commit -m "chore(graphify): rebuild knowledge graph [skip ci]"
          if git push origin HEAD:develop; then
            echo "Committed the rebuilt graph to develop."
          else
            echo "::warning::Could not push the rebuilt graph to develop - branch protection rejected it. The published site is current; the copy committed in git is not. See the comment on this step."
          fi

      # Always uploaded, so the rebuilt graph is recoverable whether or not the
      # push above was accepted.
      - name: Upload the rebuilt graph
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: graphify-out-rebuilt
          path: graphify-out/
          retention-days: 14

  contracts:
    name: Test + build (contracts)
    runs-on: ubuntu-latest
    # Deliberately NOT gated on a `paths:` filter for smart-contracts/**.
    # This context is intended to become a required status check on main, and
    # GitHub counts a *skipped* required check as not-passing - the same trap
    # the commitlint job fell into, which left every develop -> main promotion
    # BLOCKED with all checks green. With the Rust cache warm this job is
    # cheap enough on web-only PRs that always running it beats reintroducing
    # that failure mode.
    defaults:
      run:
        working-directory: smart-contracts/astrea
    steps:
      - uses: actions/checkout@v5

      # wasm32v1-none is the target soroban-sdk 22+ builds contracts for, and
      # it's the build that actually matters: it's the deployable artifact and
      # it catches no_std violations that a native build silently allows.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: smart-contracts/astrea

      - name: Format
        run: cargo fmt --all --check

      # -D warnings is safe to enforce: the contract is at zero clippy
      # warnings as of the cleanup that added this step. Keeping it at zero
      # is the point - money-path code is where "just a warning" is least
      # worth ignoring.
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

      - name: Build (wasm release artifact)
        run: cargo build --release --target wasm32v1-none

  core-go:
    name: Build, vet, test (core-go)
    runs-on: ubuntu-latest
    # Deliberately NOT gated on a `paths:` filter for services/core-go/**.
    # This context is intended to become a required status check on main, and
    # GitHub counts a *skipped* required check as not-passing - the same trap
    # the commitlint job fell into, which left every develop -> main promotion
    # BLOCKED with all checks green. See the `contracts` job above for the
    # same reasoning. Don't "optimize" this back to a paths filter.
    defaults:
      run:
        working-directory: services/core-go
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.5"
          # No go.sum yet (no external deps) - hashing go.sum here would make
          # actions/setup-go's cache step fail outright (it errors when the
          # glob matches nothing), so key the cache on go.mod instead.
          cache-dependency-path: services/core-go/go.mod

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

  commitlint:
    name: Commit messages (Conventional Commits)
    runs-on: ubuntu-latest
    # Deliberately NOT skipped at the job level. This context is a required
    # status check on main, and GitHub counts a *skipped* required check as
    # not-passing - so a job-level `if` here left every develop -> main
    # promotion permanently BLOCKED even with all checks green (the push-event
    # run reported "skipping" for this same context). Guarding each step
    # instead lets the job report success on push while still linting on PRs.
    steps:
      - uses: actions/checkout@v5
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        if: github.event_name == 'pull_request'
        with:
          node-version: 24
